<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Presentation Roulette</title><style>:root{font-family:Arial,Helvetica,sans-serif;color:#fff;background:#101017}*{box-sizing:border-box}body{margin:0;padding:24px}main{max-width:1200px;margin:auto}h1{font-size:clamp(2rem,5vw,4rem);margin:0;color:#ff8a31}p{color:#c9c9d4}.layout{display:grid;grid-template-columns:minmax(270px,390px) 1fr;gap:26px;margin-top:24px}.panel{background:#20202b;border-radius:20px;padding:22px}textarea{width:100%;height:280px;background:#101017;color:white;border:1px solid #555568;border-radius:12px;padding:14px;font-size:16px;resize:vertical}button{border:0;border-radius:12px;padding:14px 18px;font-size:16px;font-weight:800;cursor:pointer;background:#ff8a31;color:#16121a}button:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#454556;color:white}.buttons{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}.stage{text-align:center;min-width:0}.wheel-wrap{position:relative;width:min(100%,650px);aspect-ratio:1;margin:0 auto}.wheel-wrap canvas{width:100%;height:100%;display:block}.pointer{position:absolute;top:-2px;left:50%;transform:translateX(-50%);z-index:2;filter:drop-shadow(0 3px 4px #000);font-size:44px;color:white;line-height:1}#result{font-size:clamp(1.4rem,4vw,2.6rem);font-weight:900;min-height:65px;color:#ffb86a;margin-top:14px}.hint{font-size:13px}label{display:block;margin-bottom:10px;font-weight:700}.count{color:#ffb86a;font-weight:800}input[type=checkbox]{accent-color:#ff8a31} @media(max-width:850px){.layout{grid-template-columns:1fr}textarea{height:160px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}</style></head><body><main><h1>✦ PRESENTATION ROULETTE</h1><p>Who's presenting next? Paste names, spin the wheel, and let fate decide.</p><div class="layout"><section class="panel"><label for="names">STUDENT NAMES — one per line</label><textarea id="names" spellcheck="false" placeholder="Alex Rivera&#10;Jordan Lee&#10;Taylor Morgan"></textarea><p><span id="count" class="count">0</span> students on the wheel</p><label><input id="remove" type="checkbox" checked> Remove selected student after each spin</label><div class="buttons"><button id="update">Update wheel</button><button id="reset" class="secondary">Reset everyone</button></div><p class="hint">Your list and progress are saved in this browser. No student names are uploaded anywhere.</p></section><section class="panel stage"><div class="wheel-wrap"><div class="pointer">▼</div><canvas id="wheel" width="900" height="900" aria-label="Wheel of student names"></canvas></div><div id="result" aria-live="polite">Ready to spin?</div><div class="buttons" style="justify-content:center"><button id="spin" style="font-size:22px;padding:18px 45px">SPIN!</button></div></section></div></main><script>(()=>{'use strict';const $=id=>document.getElementById(id),canvas=$('wheel'),ctx=canvas.getContext('2d');const palette=['#ff8338','#29a8a1','#d94b82','#7258bd','#f4b742','#317ec4','#a4bb45','#ed6452'];let all=[],active=[],angle=0,spinning=false;const norm=s=>s.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);function save(){try{localStorage.setItem('presentationRoulette',JSON.stringify({all,active,raw:$('names').value,remove:$('remove').checked}))}catch(e){}}function draw(){let n=active.length,c=450,r=424;ctx.clearRect(0,0,900,900);ctx.save();ctx.translate(c,c);if(!n){ctx.fillStyle='#333342';ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();ctx.fillStyle='white';ctx.textAlign='center';ctx.font='bold 34px Arial';ctx.fillText('ADD STUDENTS',0,12);ctx.restore();return}let slice=Math.PI*2/n;active.forEach((name,i)=>{let a=angle+i*slice-Math.PI/2;ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,r,a,a+slice);ctx.closePath();ctx.fillStyle=palette[i%palette.length];ctx.fill();ctx.strokeStyle='#15151e';ctx.lineWidth=3;ctx.stroke();ctx.save();ctx.rotate(a+slice/2);ctx.translate(r*.57,0);let fs=Math.max(10,Math.min(27,210/n+11));ctx.font=`bold ${fs}px Arial`;ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor='#111';ctx.shadowBlur=3;let label=name.length>23?name.slice(0,21)+'…':name;ctx.fillText(label,0,0,r*.75);ctx.restore()});ctx.beginPath();ctx.arc(0,0,32,0,Math.PI*2);ctx.fillStyle='#171720';ctx.fill();ctx.strokeStyle='white';ctx.lineWidth=6;ctx.stroke();ctx.restore()}function updateCount(){$('count').textContent=active.length;$('spin').disabled=spinning||!active.length}function apply(){if(spinning)return;all=norm($('names').value);active=[...all];angle=0;$('result').textContent='Ready to spin?';updateCount();draw();save()}function reset(){if(spinning)return;active=[...all];angle=0;$('result').textContent='Everyone is back!';updateCount();draw();save()}function spin(){if(spinning||!active.length)return;spinning=true;updateCount();$('result').textContent='Spinning…';let start=angle,duration=4500+Math.random()*1200,delta=(6+Math.random()*4)*Math.PI*2+Math.random()*Math.PI*2,t0=performance.now();function frame(t){let p=Math.min(1,(t-t0)/duration),ease=1-Math.pow(1-p,4);angle=start+delta*ease;draw();if(p<1){requestAnimationFrame(frame);return}angle=((angle%(2*Math.PI))+2*Math.PI)%(2*Math.PI);let slice=2*Math.PI/active.length;let idx=Math.floor((((-angle)%(2*Math.PI))+2*Math.PI)%(2*Math.PI)/slice)%active.length;let winner=active[idx];$('result').textContent='🎉 '+winner+'!';if($('remove').checked){active.splice(idx,1);setTimeout(()=>{draw();updateCount()},900)}spinning=false;updateCount();save()}requestAnimationFrame(frame)}$('update').addEventListener('click',apply);$('reset').addEventListener('click',reset);$('spin').addEventListener('click',spin);$('remove').addEventListener('change',save);try{let saved=JSON.parse(localStorage.getItem('presentationRoulette')||'null');if(saved){all=Array.isArray(saved.all)?saved.all:[];active=Array.isArray(saved.active)?saved.active:[...all];$('names').value=saved.raw||all.join('\n');$('remove').checked=saved.remove!==false}}catch(e){}updateCount();draw()})();</script></body></html>
